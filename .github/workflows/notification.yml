name: Wiki Changelog to Discord

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: wiki-changelog-discord
  cancel-in-progress: false

jobs:
  notify-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          SINCE=$(date -u -d "24 hours ago" --iso-8601=seconds)
          COMMIT_COUNT=$(git log --oneline --since="$SINCE" | wc -l)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No changes in the last 24 hours."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FIRST_HASH=$(git log --reverse --format="%H" --since="$SINCE" | head -n 1)
          LAST_HASH=$(git log --format="%H" --since="$SINCE" | head -n 1)

          if git rev-parse "$FIRST_HASH^" >/dev/null 2>&1; then
            BASE_HASH="$FIRST_HASH^"
          else
            BASE_HASH="$FIRST_HASH"
          fi

          FILE_LIST=$(
          git diff --name-status -M --diff-filter=ACMRT "$BASE_HASH" "$LAST_HASH" |
          	awk '
          	/^[AMCT]/ {
          		print $2
          	}
          	/^R/ {
          		if ($1 == "R100") {
          		next
          		}
          		print $3
          	}
          	'
          )
          if [ -z "$FILE_LIST" ]; then
          echo "No relevant file changes in the last 24 hours."
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          exit 0
          fi
          TOTAL_FILES=$(printf "%s\n" "$FILE_LIST" | sed '/^$/d' | wc -l)

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "total_files=$TOTAL_FILES" >> "$GITHUB_OUTPUT"
          echo "first_hash=$FIRST_HASH" >> "$GITHUB_OUTPUT"
          echo "last_hash=$LAST_HASH" >> "$GITHUB_OUTPUT"
          echo "first_short=$(echo "$FIRST_HASH" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "last_short=$(echo "$LAST_HASH" | cut -c1-7)" >> "$GITHUB_OUTPUT"

          {
            echo "file_list<<EOF"
            echo "$FILE_LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FILE_LIST: ${{ steps.changes.outputs.file_list }}
          FIRST_HASH: ${{ steps.changes.outputs.first_hash }}
          LAST_HASH: ${{ steps.changes.outputs.last_hash }}
          FIRST_SHORT: ${{ steps.changes.outputs.first_short }}
          LAST_SHORT: ${{ steps.changes.outputs.last_short }}
          REPO: ${{ github.repository }}
          TOTAL_FILES: ${{ steps.changes.outputs.total_files }}
          COMMIT_COUNT: ${{ steps.changes.outputs.commit_count }}
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is missing."
            exit 1
          fi

          MAX_CHARS=1700
          TRUNCATED_LIST=""
          CHAR_COUNT=0
          SHOWN_FILES=0

          while IFS= read -r file; do
            LINE="- $file"
            LINE_LEN=${#LINE}

            if [ $((CHAR_COUNT + LINE_LEN + 1)) -gt "$MAX_CHARS" ]; then
              break
            fi

            TRUNCATED_LIST="$TRUNCATED_LIST$LINE"$'\n'
            CHAR_COUNT=$((CHAR_COUNT + LINE_LEN + 1))
            SHOWN_FILES=$((SHOWN_FILES + 1))
          done <<< "$FILE_LIST"

          {
            echo "📖 **Daily Wiki Updates**"
            echo ""
            echo "**Commits:** $COMMIT_COUNT"
            echo "**Files changed:** $TOTAL_FILES"
            echo ""
            echo -n "$TRUNCATED_LIST"

            if [ "$SHOWN_FILES" -lt "$TOTAL_FILES" ]; then
              REMAINING=$((TOTAL_FILES - SHOWN_FILES))
              echo "... and $REMAINING more files"
            fi

            echo ""
            echo "[View changes](https://github.com/$REPO/compare/$FIRST_HASH..$LAST_HASH)"
          } > /tmp/message.txt

          jq -n \
            --rawfile msg /tmp/message.txt \
            '{"username": "Wiki Changelog", "content": $msg}' |
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              -X POST \
              -H "Content-Type: application/json" \
              -d @- \
              "$DISCORD_WEBHOOK_URL"

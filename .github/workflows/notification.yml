# .github/workflows/wiki-changelog-discord.yml
name: Wiki Changelog to Discord

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  notify-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          SINCE=$(date -d "24 hours ago" --iso-8601=seconds)
          COMMIT_COUNT=$(git log --oneline --since="$SINCE" | wc -l)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No changes in the last 24 hours."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          FIRST_HASH=$(git log --reverse --format="%H" --since="$SINCE" | head -1)
          LAST_HASH=$(git log --format="%H" --since="$SINCE" | head -1)

          # Get list of changed files, excluding deletions (--diff-filter=d)
          FILE_LIST=$(git diff --name-only --diff-filter=d "$FIRST_HASH^" "$LAST_HASH")
          TOTAL_FILES=$(git diff --name-only --diff-filter=d "$BASE" "$LAST_HASH" | wc -l)

          # Skip if no non-deleted files
          if [ -z "$FILE_LIST" ]; then
            echo "No changes (only deletions) in the last 24 hours."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          echo "first_hash=$(echo "$FIRST_HASH" | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "last_hash=$(echo "$LAST_HASH" | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "file_list<<EOF" >> $GITHUB_OUTPUT
          echo "$FILE_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Discord notification
        if: steps.changes.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FILE_LIST: ${{ steps.changes.outputs.file_list }}
          FIRST_HASH: ${{ steps.changes.outputs.first_hash }}
          LAST_HASH: ${{ steps.changes.outputs.last_hash }}
          REPO: ${{ github.repository }}
          TOTAL_FILES: ${{ steps.changes.outputs.total_files }}
        run: |
          # Build file list with truncation (leave ~200 chars for header/footer)
          MAX_CHARS=1800

          # Start building the list
          TRUNCATED_LIST=""
          CHAR_COUNT=0
          SHOWN_FILES=0

          while IFS= read -r file; do
            LINE="- $file"
            LINE_LEN=${#LINE}

            if [ $((CHAR_COUNT + LINE_LEN + 1)) -gt $MAX_CHARS ]; then
              break
            fi

            TRUNCATED_LIST="$TRUNCATED_LIST$LINE"$'\n'
            CHAR_COUNT=$((CHAR_COUNT + LINE_LEN + 1))
            SHOWN_FILES=$((SHOWN_FILES + 1))
          done <<< "$FILE_LIST"

          # Build message in a temp file
          {
            echo "📖 **Daily Wiki Updates**"
            echo ""
            echo -n "$TRUNCATED_LIST"
            if [ "$SHOWN_FILES" -lt "$TOTAL_FILES" ]; then
              REMAINING=$((TOTAL_FILES - SHOWN_FILES))
              echo "... and $REMAINING more files"
            fi
            echo ""
            echo "[View changes](https://github.com/$REPO/compare/$FIRST_HASH..$LAST_HASH)"
          } > /tmp/message.txt

          jq -n --rawfile msg /tmp/message.txt '{"username": "Wiki Changelog", "content": $msg}' | \
            curl --fail-with-body --silent --show-error -X POST \
              -H "Content-Type: application/json" \
              -d @- \
              "$DISCORD_WEBHOOK_URL"

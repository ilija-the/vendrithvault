# .github/workflows/wiki-changelog-discord.yml
name: Wiki Changelog to Discord

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  notify-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          SINCE=$(date -d "24 hours ago" --iso-8601=seconds)
          COMMIT_COUNT=$(git log --oneline --since="$SINCE" | wc -l)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No changes in the last 24 hours."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          FIRST_HASH=$(git log --reverse --format="%H" --since="$SINCE" | head -1)
          LAST_HASH=$(git log --format="%H" --since="$SINCE" | head -1)

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "first_hash=$(echo "$FIRST_HASH" | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "last_hash=$(echo "$LAST_HASH" | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Send Discord notification
        if: steps.changes.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "username": "Wiki Changelog",
              "content": "📖 Wiki updated! View changes: https://github.com/${{ github.repository }}/compare/${{ steps.changes.outputs.first_hash }}..${{ steps.changes.outputs.last_hash }}"
            }' \
            "$DISCORD_WEBHOOK_URL"

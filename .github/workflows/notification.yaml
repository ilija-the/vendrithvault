# .github/workflows/wiki-changelog-discord.yml
name: Wiki Changelog to Discord

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  notify-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          SINCE=$(date -d "24 hours ago" --iso-8601=seconds)
          COMMIT_COUNT=$(git log --oneline --since="$SINCE" | wc -l)

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No changes in the last 24 hours."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT

          FIRST_HASH=$(git log --reverse --format="%H" --since="$SINCE" | head -1)
          LAST_HASH=$(git log --format="%H" --since="$SINCE" | head -1)

          # Write file stats to temp file for safe JSON encoding
          git diff --stat "$FIRST_HASH^" "$LAST_HASH" > /tmp/changed_files.txt

          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "first_hash=$(echo "$FIRST_HASH" | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "last_hash=$(echo "$LAST_HASH" | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Send Discord notification
        if: steps.changes.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_COUNT: ${{ steps.changes.outputs.commit_count }}
          FIRST_HASH: ${{ steps.changes.outputs.first_hash }}
          LAST_HASH: ${{ steps.changes.outputs.last_hash }}
        run: |
          # Build JSON payload properly using jq
          CHANGED_FILES=$(jq -Rs . /tmp/changed_files.txt)
          COMPARE_URL="https://github.com/$REPO_NAME/compare/$FIRST_HASH..$LAST_HASH"

          jq -n \
            --arg repo "$REPO_NAME" \
            --argjson commits "$COMMIT_COUNT" \
            --arg changed_files "$CHANGED_FILES" \
            --arg compare_url "$COMPARE_URL" \
            --arg first "$FIRST_HASH" \
            --arg last "$LAST_HASH" \
            '{
              username: "Wiki Changelog",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [{
                title: "📖 Wiki Updates",
                description: "**Repository:** \($repo)\n**Commits:** \($commits)",
                color: 5793266,
                fields: [
                  {
                    name: "📊 File Changes",
                    value: $changed_files,
                    inline: false
                  },
                  {
                    name: "🔗 View Changes",
                    value: "[Compare: `\($first)..\($last)`](\($compare_url))",
                    inline: false
                  }
                ],
                footer: {
                  text: "Wiki Changelog • 24h Summary"
                },
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }' | curl -s -X POST \
              -H "Content-Type: application/json" \
              -d @- \
              "$DISCORD_WEBHOOK_URL"
